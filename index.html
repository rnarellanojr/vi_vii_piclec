l preparation listed is fractional distillation of liquid air; electrolysis of water is the laboratory method listed."}, {"id": 8, "level": "recall", "group": "VIA", "question": "Which element is most abundant in the human body by weight?", "options": ["Oxygen", "Sulfur", "Selenium", "Tellurium"], "answer": 0, "explanation": "The notes identify oxygen as the most abundant element in the human body by weight."}, {"id": 9, "level": "recall", "group": "VIA", "question": "Which oxygen allotrope is a bluish gas with an irritating odor?", "options": ["Ozone", "Diatomic oxygen", "Sulfur trioxide", "Chlorine dioxide"], "answer": 0, "explanation": "Ozone, O₃, is the bluish, irritating-smelling allotrope of oxygen."}, {"id": 10, "level": "recall", "group": "VIA", "question": "Which element is also called ‘brimstone’ or ‘burning stone’?", "options": ["Sulfur", "Selenium", "Chromium", "Bromine"], "answer": 0, "explanation": "Brimstone and burning stone are names for sulfur."}, {"id": 11, "level": "recall", "group": "VIA", "question": "Which description matches elemental sulfur?", "options": ["Pale yellow, odorless, brittle solid", "Bluish gas with an irritating odor", "Dark reddish-brown fuming liquid", "Grayish-black solid with metallic luster"], "answer": 0, "explanation": "Sulfur is described as a pale yellow, odorless, brittle solid."}, {"id": 12, "level": "recall", "group": "VIA", "question": "What is the other name for rhombic sulfur?", "options": ["Alpha sulfur", "Beta sulfur", "Plastic sulfur", "Milk of sulfur"], "answer": 0, "explanation": "Rhombic sulfur is alpha sulfur; monoclinic sulfur is beta sulfur."}, {"id": 13, "level": "recall", "group": "VIA", "question": "Which sulfur preparation is called ‘milk of sulfur’?", "options": ["Precipitated sulfur", "Sublimed sulfur", "Washed sulfur", "Sulfurated lime solution"], "answer": 0, "explanation": "Precipitated sulfur is called lac sulfur or milk of sulfur."}, {"id": 14, "level": "recall", "group": "VIA", "question": "Which preparation is called ‘flowers of sulfur’?", "options": ["Sublimed sulfur", "Precipitated sulfur", "Washed sulfur", "Compound sulfur ointment"], "answer": 0, "explanation": "Sublimed sulfur is known as flowers of sulfur."}, {"id": 15, "level": "recall", "group": "VIA", "question": "Which preparation is known as Vleminckx’ solution?", "options": ["Sulfurated lime solution", "Strong iodine solution", "Sodium hypochlorite solution", "Phenolated iodine solution"], "answer": 0, "explanation": "Vleminckx’ solution is sulfurated lime solution, listed as a scabicide."}, {"id": 16, "level": "recall", "group": "VIA", "question": "Which gas has the characteristic odor of rotten eggs?", "options": ["Hydrogen sulfide", "Oxygen", "Ozone", "Chlorine"], "answer": 0, "explanation": "Hydrogen sulfide, H₂S, is the gas described as smelling like rotten eggs."}, {"id": 17, "level": "recall", "group": "VIA", "question": "Which acid is known as ‘oil of vitriol’?", "options": ["Sulfuric acid", "Sulfurous acid", "Hydrochloric acid", "Hydrofluoric acid"], "answer": 0, "explanation": "Oil of vitriol is sulfuric acid, H₂SO₄."}, {"id": 18, "level": "recall", "group": "VIA", "question": "Which selenium compound is used in antifungal shampoos for dandruff?", "options": ["Selenium disulfide", "Selenic acid", "Sodium iodide", "Potassium dichromate"], "answer": 0, "explanation": "Selenium disulfide, SeS₂, is the shampoo ingredient listed for dandruff."}, {"id": 19, "level": "recall", "group": "VIB", "question": "What meaning is associated with the Greek root of ‘chromium’?", "options": ["Color", "Moon", "Earth", "Artificial"], "answer": 0, "explanation": "The name chromium is associated with color, reflecting its highly colored compounds."}, {"id": 20, "level": "recall", "group": "VIB", "question": "What color is chromic oxide in the notes?", "options": ["Green", "Blue", "Purplish red", "Yellow"], "answer": 0, "explanation": "Chromic oxide is listed as green."}, {"id": 21, "level": "recall", "gr st electronegative?", "options": ["Fluorine", "Chlorine", "Bromine", "Iodine"], "answer": 0, "explanation": "The notes identify fluorine as the most reactive and most electronegative element."}, {"id": 29, "level": "recall", "group": "VIIA", "question": "Which acid attacks or etches glass to produce a frosted surface?", "options": ["Hydrofluoric acid", "Hydrochloric acid", "Sulfurous acid", "Hydroiodic acid"], "answer": 0, "explanation": "Hydrofluoric acid attacks or etches glass."}, {"id": 30, "level": "recall", "group": "VIIA", "question": "What is Freon-12 primarily used as in the notes?", "options": ["Refrigerant", "Electrolyte replenisher", "Titration indicator", "Expectorant"], "answer": 0, "explanation": "Freon-12 is listed as a chlorofluorocarbon refrigerant."}, {"id": 31, "level": "recall", "group": "VIIA", "question": "Teflon is a polymer of which substance?", "options": ["Tetrafluoroethylene", "Dichlorodifluoromethane", "Sodium fluoride", "Hydrogen fluoride"], "answer": 0, "explanation": "Teflon is the polymer of tetrafluoroethylene."}, {"id": 32, "level": "recall", "group": "VIIA", "question": "Which halogen is a greenish-yellow gas with a suffocating odor?", "options": ["Chlorine", "Fluorine", "Bromine", "Iodine"], "answer": 0, "explanation": "Chlorine is described as a greenish-yellow gas with a suffocating odor."}, {"id": 33, "level": "recall", "group": "VIIA", "question": "What sodium hypochlorite concentration is listed for modified Dakin’s solution?", "options": ["0.5%", "5%", "0.9%", "2%"], "answer": 0, "explanation": "The notes list modified Dakin’s solution as 0.5% sodium hypochlorite."}, {"id": 34, "level": "recall", "group": "VIIA", "question": "Which substance is also known as chlorinated lime?", "options": ["Bleaching powder", "Halazone", "Ammonium chloride", "Sodium chloride"], "answer": 0, "explanation": "Bleaching powder is called chlorinated lime or chloride of lime."}, {"id": 35, "level": "recall", "group": "VIIA", "question": "What is the use of halazone listed in the notes?", "options": ["Water disinfectant", "Refrigerant", "Expectorant", "Titration indicator"], "answer": 0, "explanation": "Halazone is listed as a water disinfectant."}, {"id": 36, "level": "recall", "group": "VIIA", "question": "Which acid is commonly called ‘muriatic acid’?", "options": ["Hydrochloric acid", "Hydrofluoric acid", "Hydroiodic acid", "Sulfuric acid"], "answer": 0, "explanation": "Muriatic acid is hydrochloric acid."}, {"id": 37, "level": "recall", "group": "VIIA", "question": "What is the sodium chloride concentration of normal saline solution?", "options": ["0.9%", "0.5%", "2%", "5%"], "answer": 0, "explanation": "Normal saline solution, also called physiological salt solution, contains 0.9% NaCl."}, {"id": 38, "level": "recall", "group": "VIIA", "question": "Which compound is called ‘sal ammoniac’?", "options": ["Ammonium chloride", "Sodium chloride", "Sodium iodide", "Calcium fluoride"], "answer": 0, "explanation": "Ammonium chloride is called muriate of ammonia or sal ammoniac."}, {"id": 39, "level": "recall", "group": "VIIA", "question": "Which halogen is a dark reddish-brown fuming liquid?", "options": ["Bromine", "Chlorine", "Fluorine", "Iodine"], "answer": 0, "explanation": "Bromine is described as a dark reddish-brown fuming liquid."}, {"id": 40, "level": "recall", "group": "VIIA", "question": "What is Koppeschaar’s solution used to determine?", "options": ["Phenols", "Phosphates", "Alkaloids", "Silver compounds"], "answer": 0, "explanation": "Koppeschaar’s solution is 0.1 N bromine solution used in the determination of phenols."}, {"id": 41, "level": "recall", "group": "VIIA", "question": "Which halogen is a grayish-black solid with metallic luster?", "options": ["Iodine", "Bromine", "Chlorine", "Fluorine"], "answer": 0, "explanation": "The physical description given for iodine is a grayish-black solid with metallic luster."}, {"id": 42, "level": "recall", "group": "VIIA", "question": "What color does iodine give in nonpolar solvents such as carbon tetrachloride?", "options": ["Violet", "Reddish brown", "Greenish yellow", "Blue"], "answer": 0, "explanation": "The notes describe iodine as violet in nonpolar solvents and reddish brown in polar solvents."}, {"id": 43, "level": "recall", "group": "VIIA", "question": "What is another name for strong iodine solution?", "options": ["Lugol’s solution", "Boulton’s solution", "Labarraque’s solution", "Vleminckx’ solution"], "answer": 0, "explanation": "Strong iodine solution is Lugol’s solution; the notes list it as 5% iodine."}, {"id": 44, "level": "recall", "group": "VIIA", "question": "Which formulation contains 2% iodine in 50% alcohol with sodium iodide?", "options": ["Iodine tincture", "Strong iodine solution", "Iodized oil", "Phenolated iodine solution"], "answer": 0, "explanation": "The listed formulation of iodine tincture is 2% iodine in 50% alcohol with NaI."}, {"id": 45, "level": "recall", "group": "VIIA", "question": "Which preparation is called Boulton’s solution?", "options": ["Phenolated iodine solution", "Strong iodine solution", "Iodine tincture", "Iodized oil"], "answer": 0, "explanation": "Phenolated iodine solution is also called Boulton’s solution, French mixture, or carbolized iodine solution."}, {"id": 46, "level": "recall", "group": "VIIA", "question": "Which iodine isotope is listed for thyroid diseases and cancer?", "options": ["Iodine-131", "Iodine-127", "Iodine-129", "Iodine-125"], "answer": 0, "explanation": "The notes list radioactive iodine-131 for thyroid diseases and cancer."}, {"id": 47, "level": "recall", "group": "VIIB", "question": "Manganese is chemically and geologically related to which element?", "options": ["Iron", "Iodine", "Fluorine", "Tellurium"], "answer": 0, "explanation": "The manganese section describes it as chemically and geologically related to iron."}, {"id": 48, "level": "recall", "group": "VIIB", "question": "Which manganese compound is an oxidizing agent, disinfectant, and deodorant?", "options": ["Potassium permanganate", "Manganous carbonate", "Manganous citrate", "Manganese dioxide"], "answer": 0, "explanation": "Potassium permanganate is listed as an oxidizing agent, disinfectant, and deodorant."}, {"id": 49, "level": "recall", "group": "VIIB", "question": "What does the Greek word ‘technetos’ mean?", "options": ["Artificial", "Color", "Moon", "To flow"], "answer": 0, "explanation": "Technetium derives its name from technetos, meaning artificial."}, {"id": 50, "level": "recall", "group": "VIIB", "question": "Which technetium isotope is used as a radioactive tracer for medical imaging?", "options": ["Technetium-99m", "Technetium-97", "Technetium-98", "Technetium-96"], "answer": 0, "explanation": "Technetium-99m is the radioactive tracer identified for medical imaging."}, {"id": 51, "level": "understanding", "group": "VIA", "question": "Why are O₂ and O₃ described as allotropes?", "options": ["They are different forms of the same element.", "They contain different elements in the same ratio.", "They are identical molecules with different names.", "They are salts made from the same acid."], "answer": 0, "explanation": "O₂ and O₃ are different molecular forms of oxygen, so they are allotropes of the same element."}, {"id": 52, "level": "understanding", "group": "VIA", "question": "Sulfur is described as brittle. Which behavior best matches this property?", "options": ["It breaks when struck rather than bending.", "It readily stretches into a wire.", "It readily flattens into a flexible sheet.", "It gives off a strong odor when untouched."], "answer": 0, "explanation": "Brittleness means a material tends to fracture rather than bend or deform."}, {"id": 53, "level": "understanding", "group": "VIA", "question": "Which statement best distinguishes the two sulfur allotropes named in the notes?", "options": ["Rhombic and monoclinic sulfur are crystalline forms of sulfur.", "Rhombic and monoclinic sulfur are two sulfur-containing acids.", "Rhombic sulfur is oxygen, while monoclinic sulfur is ozone.", "Rhombic and monoclinic sulfur are different chemical elements."], "answer": 0, "explanation": "The notes place rhombic (alpha) and monoclinic (beta) sulfur under crystalline allotropes."}, {"id": 54, "level": "understanding", "group": "VIB", "question": "Why should chromium trioxide be kept from intimate contact with organic substances?", "options": ["Serious explosions may result.", "Its only effect is to turn the organics green.", "It becomes an electrolyte replenisher.", "It loses all chemical reactivity."], "answer": 0, "explanation": "The specific caution in the notes states that intimate contact between chromium trioxide and organic substances may cause serious explosions."}, {"id": 55, "level": "understanding", "group": "VIB", "question": "Which pairing correctly distinguishes the analytical uses of molybdenum and tungsten compounds?", "options": ["Ammonium molybdate—phosphates; phosphotungstic acid—alkaloids", "Ammonium molybdate—alkaloids; phosphotungstic acid—phosphates", "Ammonium molybdate—phenols; phosphotungstic acid—silver compounds", "Ammonium molybdate—silver compounds; phosphotungstic acid—phenols"], "answer": 0, "explanation": "The notes associate ammonium molybdate with phosphate determination and phosphotungstic acid with qualitative testing for alkaloids."}, {"id": 56, "level": "understanding", "group": "VIIA", "question": "Why is a Teflon container more suitable than a glass container for hydrofluoric acid, based on the notes?", "options": ["Hydrofluoric acid attacks glass; Teflon is listed as a container material.", "Glass converts hydrofluoric acid into normal saline.", "Teflon changes hydrofluoric acid into a harmless gas.", "Hydrofluoric acid dissolves Teflon more readily than glass."], "answer": 0, "explanation": "The notes link hydrofluoric acid with glass etching and identify Teflon as a material used for HF containers."}, {"id": 57, "level": "understanding", "group": "VIIA", "question": "Why are sodium iodide or potassium iodide added to strong iodine solution?", "options": ["They enhance iodine solubility through triiodide formation.", "They convert iodine completely into chlorine.", "They remove all iodine from the preparation.", "They make iodine insoluble in the liquid."], "answer": 0, "explanation": "Iodide helps dissolve iodine by forming the triiodide ion, I₃⁻."}, {"id": 58, "level": "understanding", "group": "VIIA", "question": "A student claims iodine becomes a different element because it is violet in CS₂ but reddish brown in water. Which response best corrects this reasoning?", "options": ["A solvent can change iodine’s observed color without changing the element.", "The color change proves iodine has become bromine.", "Iodine must have the same color in every solvent.", "The color change proves iodine has become chlorine."], "answer": 0, "explanation": "The notes describe different iodine colors in polar and nonpolar solvents. These are solvent-dependent appearances of iodine, not changes in elemental identity."}, {"id": 59, "level": "understanding", "group": "VIIA", "question": "Which comparison of iodine solution and iodine tincture matches the notes?", "options": ["Both contain 2% iodine, but the tincture includes 50% alcohol and is more irritating.", "Both contain 5% iodine, but the tincture contains vegetable oil.", "The solution contains no iodine, while the tincture contains 5% iodine.", "The tincture contains only sodium iodide and no elemental iodine."], "answer": 0, "explanation": "The notes list 2% iodine for both preparations; the tincture includes 50% alcohol and is described as more irritating."}, {"id": 60, "level": "understanding", "group": "VIIB", "question": "Which statement best distinguishes technetium’s imaging use from a normal biological role?", "options": ["Technetium-99m can serve as a tracer even though technetium has no natural biological role.", "Any element used in imaging must be an essential nutrient.", "Technetium must normally be abundant in the body to be a tracer.", "Technetium-99m is a nonradioactive electrolyte replenisher."], "answer": 0, "explanation": "The notes state both that technetium has no natural biological role and that technetium-99m is used as a radioactive imaging tracer."}]</script>
<script>
'use strict';
const BANK = JSON.parse(document.getElementById('question-data').textContent);
const DURATION_MS=60000, ROUND_SIZE=4, HISTORY_KEY='piclec-minute-history-v1';
const app=document.getElementById('app');
const arrow='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-5-5 5 5-5 5"/></svg>';
let round=null, timerId=null, soundOn=false, audioContext=null, deck=[], history=readHistory();
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function shuffle(items,rng=Math.random){const a=[...items];for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function drawQuestions(){if(deck.length<ROUND_SIZE) deck=shuffle(BANK);return deck.splice(0,ROUND_SIZE).map(q=>{const options=shuffle(q.options.map((text,i)=>({text,correct:i===q.answer})));return {...q,options};});}
function gradeAttempt(questions,answers){const correct=questions.reduce((sum,q,i)=>sum+(answers[i]!==null&&q.options[answers[i]]?.correct?1:0),0);return {correct,points:2+2*correct};}
function readHistory(){try{const data=JSON.parse(localStorage.getItem(HISTORY_KEY)||'[]');return Array.isArray(data)?data.filter(x=>x&&Number.isInteger(x.correct)&&x.correct>=0&&x.correct<=4&&x.points===2+2*x.correct&&typeof x.at==='string'&&Number.isFinite(Date.parse(x.at))).slice(0,5):[];}catch{return [];}}
function saveHistory(){try{localStorage.setItem(HISTORY_KEY,JSON.stringify(history));}catch{}}
function announce(message){document.getElementById('announcer').textContent=message;}
function focusHeading(){app.querySelector('h1,h2')?.focus({preventScroll:true});}
function goTop(){window.scrollTo({top:0,behavior:'instant'});}
function tone(final=false){if(!soundOn)return;try{audioContext=audioContext||new(window.AudioContext||window.webkitAudioContext)();audioContext.resume().catch(()=>{});const osc=audioContext.createOscillator(),gain=audioContext.createGain();osc.connect(gain);gain.connect(audioContext.destination);osc.frequency.value=final?660:440;gain.gain.setValueAtTime(.055,audioContext.currentTime);gain.gain.exponentialRampToValueAtTime(.001,audioContext.currentTime+.16);osc.start();osc.stop(audioContext.currentTime+.17);}catch{}}
document.getElementById('sound').addEventListener('click',()=>{soundOn=!soundOn;document.getElementById('sound').textContent=soundOn?'Sound on':'Sound off';document.getElementById('sound').setAttribute('aria-pressed',String(soundOn));if(soundOn)tone();});
function historyHTML(){return '<details class="history"><summary>Recent attempts on this device'+(history.length?' · '+history.length:'')+'</summary>'+(history.length?'<ul class="history-list">'+history.map(h=>'<li><span>'+escapeHTML(new Date(h.at).toLocaleString(undefined,{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}))+'</span><div>'+h.correct+'/4 correct · <strong>'+h.points+'/10 points</strong></div></li>').join('')+'</ul>':'<p class="empty">Your last five completed attempts will appear here.</p>')+'</details>';}
function showHome(){clearInterval(timerId);round=null;app.innerHTML=`<section class="start-page"><div class="card start-card"><h1 tabindex="-1">Quick Quiz</h1><p class="start-facts">4 questions · 1 minute</p><button class="primary" id="start">Start quiz ${arrow}</button></div></section>`;document.getElementById('start').addEventListener('click',startRound);}
function startRound(){clearInterval(timerId);round={questions:drawQuestions(),answers:Array(ROUND_SIZE).fill(null),index:0,deadline:performance.now()+DURATION_MS,status:'active',warned:false,at:new Date().toISOString()};renderQuiz();timerId=setInterval(updateTimer,100);announce('Challenge started. Four questions. One minute total.');updateTimer();goTop();focusHeading();}
function renderQuiz(){if(!round||round.status!=='active')return;const q=round.questions[round.index],count=round.answers.filter(a=>a!==null).length;app.innerHTML=`<div class="quiz-layout"><section class="card quiz-card"><div class="quiz-top"><div class="steps" aria-label="Question navigation">${round.questions.map((_,i)=>`<button class="step ${round.answers[i]!==null?'answered':''} ${i===round.index?'active':''}" data-step="${i}" ${i===round.index?'aria-current="step"':''} aria-label="Question ${i+1}, ${round.answers[i]!==null?'answered':'unanswered'}">${i+1}</button>`).join('')}</div><span class="question-count">QUESTION ${round.index+1} OF 4</span></div><div class="quiz-meta"><span class="tag">${q.level.toUpperCase()}</span><span class="group-tag">GROUP ${q.group}</span></div><h1 class="question" id="question-title" tabindex="-1">${escapeHTML(q.question)}</h1><div class="options" role="group" aria-labelledby="question-title">${q.options.map((o,i)=>`<button class="option ${round.answers[round.index]===i?'selected':''}" data-answer="${i}" aria-pressed="${round.answers[round.index]===i}"><span class="letter">${'ABCD'[i]}</span><span>${escapeHTML(o.text)}</span></button>`).join('')}</div><div class="quiz-bottom"><button class="nav-btn" id="previous" ${round.index===0?'disabled':''}>← Previous</button><span class="answer-count">${count} of 4 answered</span><button class="nav-btn next" id="next" ${round.index===3?'disabled':''}>Next →</button></div></section><aside><div class="card side-card"><p class="side-label">Time remaining</p><div class="timer" id="timer"><svg viewBox="0 0 150 150" aria-hidden="true"><circle class="ring-track" cx="75" cy="75" r="66"/><circle class="ring-fill" id="ring" cx="75" cy="75" r="66"/></svg><div><div class="time-number" id="clock" role="timer" aria-label="Time remaining">1:00</div><div class="time-text">MIN : SEC</div></div></div><button class="primary submit" id="submit">Submit attempt</button><p class="side-help">Answers stay editable until submission. At 0:00, this attempt submits automatically.</p></div><div class="round-note"><strong>Every answer counts.</strong><br>2 base points + 2 per correct item.<br>Maximum: 10 points.</div><p class="key-hint">Keyboard: A–D to answer · ← → to move</p></aside></div>`;app.querySelectorAll('[data-answer]').forEach(b=>b.addEventListener('click',()=>chooseAnswer(Number(b.dataset.answer))));app.querySelectorAll('[data-step]').forEach(b=>b.addEventListener('click',()=>navigate(Number(b.dataset.step))));document.getElementById('previous').addEventListener('click',()=>navigate(round.index-1));document.getElementById('next').addEventListener('click',()=>navigate(round.index+1));document.getElementById('submit').addEventListener('click',()=>{if(checkTime())finishRound(false);});updateTimer();}
function checkTime(){if(!round||round.status!=='active')return false;if(performance.now()>=round.deadline){finishRound(true);return false;}return true;}
function chooseAnswer(index){if(!checkTime())return;round.answers[round.index]=index;app.querySelectorAll('[data-answer]').forEach(b=>{const active=Number(b.dataset.answer)===index;b.classList.toggle('selected',active);b.setAttribute('aria-pressed',String(active));});const step=app.querySelector('[data-step="'+round.index+'"]');step.classList.add('answered');step.setAttribute('aria-label','Question '+(round.index+1)+', answered');app.querySelector('.answer-count').textContent=round.answers.filter(a=>a!==null).length+' of 4 answered';announce('Answer '+ 'ABCD'[index]+' selected for question '+(round.index+1)+'.');}
function navigate(index){if(!checkTime()||index<0||index>=ROUND_SIZE)return;round.index=index;renderQuiz();focusHeading();}
function updateTimer(){if(!round||round.status!=='active')return;const left=round.deadline-performance.now();if(left<=0){finishRound(true);return;}const seconds=Math.ceil(left/1000),display=Math.floor(seconds/60)+':'+String(seconds%60).padStart(2,'0');document.getElementById('clock').textContent=display;document.getElementById('clock').setAttribute('aria-label',seconds+' seconds remaining');document.getElementById('ring').style.strokeDashoffset=String(414.69*(1-left/DURATION_MS));document.getElementById('timer').classList.toggle('urgent',seconds<=10);if(seconds<=10&&!round.warned){round.warned=true;announce('Ten seconds remaining.');tone();}}
function finishRound(timedOut){if(!round||round.status!=='active')return;round.status='finished';clearInterval(timerId);const grade=gradeAttempt(round.questions,round.answers);round.result=grade;round.timedOut=timedOut;round.finishedAt=new Date().toISOString();history=[{at:round.finishedAt,...grade},...history].slice(0,5);saveHistory();tone(true);renderResults();announce((timedOut?'Time is up. ':'Attempt submitted. ')+grade.correct+' of four correct. '+grade.points+' out of ten points.');goTop();focusHeading();}
function renderResults(){const r=round.result;const headline=['A fresh start for your recall.','One connection made.','Halfway to a clean sweep.','Almost a clean sweep.','A perfect four.'][r.correct];app.innerHTML=`<section class="result-intro"><p class="eyebrow">${round.timedOut?'TIME’S UP · AUTO-SUBMITTED':'CHALLENGE COMPLETE'}</p><h1 tabindex="-1">${headline}</h1><p>Take a moment to review, then try a fresh set.</p></section><section class="card result-banner"><div class="score-disc"><strong>${r.points}</strong><span>OUT OF 10 POINTS</span></div><div class="result-copy"><h2>${r.correct} of 4 correct</h2><p>2 base points + ${r.correct} × 2 correct-answer points = <strong>${r.points} points</strong>.<br>${round.answers.filter(a=>a===null).length} unanswered · counted as incorrect</p><div class="result-actions"><button class="primary" id="again">Try another four</button><button class="nav-btn" id="home">Back to start</button></div></div></section><div class="review-head"><h2>Your answer review</h2><span>Learn from every attempt</span></div><section class="review-list" aria-label="Answer review">${round.questions.map((q,i)=>{const selected=round.answers[i],correct=selected!==null&&q.options[selected].correct;return `<article class="card review-card"><div class="review-status ${correct?'correct':''}">${i+1}. ${correct?'✓ Correct':selected===null?'— Unanswered':'× Incorrect'}</div><h3 class="review-question">${escapeHTML(q.question)}</h3><div class="review-options">${q.options.map((o,j)=>`<div class="review-option ${o.correct?'right':j===selected?'wrong':''}">${'ABCD'[j]}. ${escapeHTML(o.text)}${o.correct?'<small>✓ CORRECT ANSWER'+(selected===j?' · YOUR ANSWER':'')+'</small>':j===selected?'<small>× YOUR ANSWER</small>':''}</div>`).join('')}</div><p class="explanation">${escapeHTML(q.explanation)}</p><p class="review-meta">${q.level.toUpperCase()} · GROUP ${q.group} · ITEM ${String(q.id).padStart(2,'0')}</p></article>`;}).join('')}</section><p class="result-time">Completed ${escapeHTML(new Date(round.finishedAt).toLocaleString())}</p>${historyHTML()}`;document.getElementById('again').addEventListener('click',startRound);document.getElementById('home').addEventListener('click',()=>{showHome();goTop();focusHeading();});}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')updateTimer();});
